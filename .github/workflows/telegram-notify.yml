name: Telegram — статус сборки

on:
  workflow_run:
    workflows: ["Сборка apk","pages build and deployment"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      APP_NAME: Упражнения
    steps:
      - name: Отправить уведомление
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, time
          import urllib.request
          from urllib.error import HTTPError, URLError

          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          app = os.environ["APP_NAME"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"

          def telegram(method, data):
              req = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  data=json.dumps(data).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.load(response)
              except (HTTPError, URLError, TimeoutError):
                  sys.exit("Telegram API недоступен или отклонил запрос. Проверь секреты и настройки бота.")
              if not result.get("ok"):
                  sys.exit("Telegram API вернул ошибку.")
              return result["result"]

          def send(target, message):
              telegram("sendMessage", {"chat_id": target, "text": message, "link_preview_options": {"is_disabled": True}})

          if not token:
              if manual:
                  sys.exit("Добавь секрет TELEGRAM_BOT_TOKEN.")
              print("Telegram не настроен: уведомление пропущено.")
              sys.exit(0)

          if not chat:
              if manual:
                  sys.exit("Добавь секрет TELEGRAM_CHAT_ID.")
              print("Telegram не настроен: уведомление пропущено.")
              sys.exit(0)

          if manual:
              send(chat, "💚 " + app + "\nТестовое уведомление. Связь с GitHub работает!")
              sys.exit(0)

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              # GitHub's built-in branch-based Pages workflow does not reliably
              # emit workflow_run for other workflows. Match this push's exact SHA.
              sha = os.environ["GITHUB_SHA"]
              api = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
              headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                         "Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28"}
              run = None
              for _ in range(48):
                  req = urllib.request.Request(api + "/actions/runs?head_sha=" + sha + "&per_page=50", headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as response:
                      runs = json.load(response)["workflow_runs"]
                  candidates = [r for r in runs if r.get("head_sha") == sha
                                and r.get("name") == "pages build and deployment"
                                and r.get("head_branch") == os.environ["DEFAULT_BRANCH"]]
                  if candidates:
                      candidate = max(candidates, key=lambda r: r["id"])
                      if candidate.get("status") == "completed":
                          run = candidate
                          break
                  time.sleep(10)
              if not run:
                  send(chat, "🟡 " + app + "\nПубликация пока не подтверждена.\n" +
                       os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions")
                  sys.exit(0)
          else:
              run = event["workflow_run"]
          conclusion = run.get("conclusion")
          if conclusion not in ("success", "failure", "timed_out", "action_required"):
              sys.exit(0)
          branch = run.get("head_branch") or "?"
          url = run["html_url"]
          owner_repo = os.environ["GITHUB_REPOSITORY"]
          endpoint = (os.environ["GITHUB_API_URL"] + "/repos/" + owner_repo +
                      "/actions/runs/" + str(run["id"]) + "/attempts/" + str(run["run_attempt"]) + "/jobs?per_page=100")
          req = urllib.request.Request(endpoint, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(req, timeout=20) as response:
              jobs = json.load(response)["jobs"]
          def good(name):
              return any(j.get("name") == name and j.get("conclusion") == "success" for j in jobs)
          if conclusion != "success":
              bad = []
              for j in jobs:
                  if j.get("conclusion") in ("failure", "timed_out", "action_required"):
                      steps = [s["name"] for s in j.get("steps", []) if s.get("conclusion") == "failure"]
                      bad.append(j["name"] + (": " + ", ".join(steps) if steps else ""))
              message = "🔴 " + app + "\nСборка не прошла.\n" + ("; ".join(bad) or conclusion)
          elif run.get("event") == "pull_request" and good("test"):
              message = "🟢 " + app + "\nТесты прошли. Можно вливать и выкатывать."
          elif branch == os.environ["DEFAULT_BRANCH"] and good("deploy"):
              message = "💚 " + app + "\nДеплой успешно завершён. Можно обновлять приложение."
          elif run.get("name") == "Сборка apk" and good("build"):
              message = "🟢 " + app + "\nAPK собран. Можно скачать из Artifacts."
          else:
              message = "🟢 " + app + "\nПроверки прошли. Публикация не подтверждена."
          send(chat, message + "\nВетка: " + branch + "\n" + url)
          PY
